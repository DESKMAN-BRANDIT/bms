<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Secure login for Business Management System"
  >

  <title>BMS — Login</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body class="auth-page">


  <main class="auth-container">


    <section class="auth-card">


      <div class="auth-brand">

        <div class="auth-logo">
          B
        </div>

        <div>

          <h1>
            BMS
          </h1>

          <span>
            Business Management System
          </span>

        </div>

      </div>


      <div class="auth-heading">

        <h2>
          Welcome back
        </h2>

        <p>
          Login to continue to your business dashboard.
        </p>

      </div>


      <form
        id="loginForm"
        class="auth-form"
        novalidate
      >


        <div class="form-group">

          <label for="email">
            Email address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>


        <div
          id="message"
          class="auth-message"
          role="alert"
          aria-live="polite"
        ></div>


        <button
          type="submit"
          id="loginBtn"
          class="auth-button"
        >
          Login
        </button>


      </form>


      <div class="auth-footer">

        <p>
          Don't have an account?
        </p>

        <a href="register.html">
          Create an account
        </a>

      </div>


    </section>


  </main>


  <script
    type="module"
    src="js/auth.js"
  ></script>

</body>

</html>
