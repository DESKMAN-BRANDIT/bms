<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Create a Business Management System account"
  >

  <title>BMS — Create Account</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body class="auth-page">

  <main class="auth-container">

    <section class="auth-card">


      <!-- BRAND -->

      <div class="auth-brand">

        <div class="auth-logo">
          B
        </div>

        <div>

          <h1>BMS</h1>

          <span>
            Business Management System
          </span>

        </div>

      </div>


      <!-- HEADING -->

      <div class="auth-heading">

        <h2>
          Create your account
        </h2>

        <p>
          Set up your business and start managing it
          from one place.
        </p>

      </div>


      <!-- FORM -->

      <form
        id="registerForm"
        class="auth-form"
        novalidate
      >


        <!-- NAME -->

        <div class="form-group">

          <label for="name">
            Full name
          </label>

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          >

        </div>


        <!-- BUSINESS -->

        <div class="form-group">

          <label for="businessName">
            Business name
          </label>

          <input
            type="text"
            id="businessName"
            name="businessName"
            placeholder="Enter your business name"
            autocomplete="organization"
            required
          >

        </div>


        <!-- EMAIL -->

        <div class="form-group">

          <label for="email">
            Email address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="6"
            required
          >

          <small class="form-help">
            Use at least 6 characters.
          </small>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

          <label for="confirmPassword">
            Confirm password
          </label>

          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Re-enter your password"
            autocomplete="new-password"
            minlength="6"
            required
          >

        </div>


        <!-- MESSAGE -->

        <div
          id="message"
          class="auth-message"
          role="alert"
          aria-live="polite"
        ></div>


        <!-- BUTTON -->

        <button
          type="submit"
          id="registerBtn"
          class="auth-button"
        >
          Create Account
        </button>


      </form>


      <!-- FOOTER -->

      <div class="auth-footer">

        <p>
          Already have an account?
        </p>

        <a href="login.html">
          Login
        </a>

      </div>


    </section>

  </main>


  <script
    type="module"
    src="js/auth.js"
  ></script>

</body>

</html>
